  <div class="info">
    <strong>Properties yang dikirim:</strong><br>
    <code>quiz-category="ulangan_harian"</code> &mdash; Masuk kalkulasi nilai akhir (bobot 3/8)<br>
    <code>sheet-name="Ulangan Harian 3"</code> &mdash; Sheet terpisah per ulangan harian

  <explode-quiz
    id="uh1"
    sheet-name="Ulangan Harian 3"
    quiz-category="ulangan_harian"
    apps-script-url="https://script.google.com/macros/s/AKfycbzwwv-XI1EC3puQdS8rsTjOobw8rmNXOqOkklInfFB5xBdQJ83po2lq-gxRtDuiE5LG/exec"

    questions='[
      {"question": "Apa kepanjangan dari HAX?",   "image": "    https://lucidar.me/en/web-dev/files/css-frameworks.png","choices": ["Hyper-Active X", "Hybrid Authoring eXperience", "High Accuracy XML", "Hyper Access X"], "correctAnswers": [1]},

    ]'>
  </explode-quiz>

  <script type="module">
    const quiz = document.querySelector('#uh1');
    const auth = document.querySelector('quiz-user-auth');

    // Sinkronkan data user ke quiz
    window.addEventListener('quiz-user-login', (e) => {
      quiz.studentId = e.detail.studentId;
      quiz.studentName = e.detail.nama;
      quiz.studentNis = e.detail.nis;
      quiz.studentAbsen = e.detail.absen;
      quiz.studentKelas = e.detail.kelas;
    });
  </script>
