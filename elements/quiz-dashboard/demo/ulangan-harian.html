<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <style>

    h1 { color: #6750a4; }
    .info { background: #f3f0fa; border: 1px solid #c7b3fc; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px; }

    body.dark-mode {

      color-scheme: dark;
      --ddd-theme-default-surface: #12141a;

    body.dark-mode pre { background: #1b1e27; color: #e8eaf0; }

<body>
  <h1>ðŸ“ Ulangan Harian 1</h1>
  <div class="info">
    <strong>Properties yang dikirim:</strong><br>
    <code>quiz-category="ulangan_harian"</code> &mdash; Masuk kalkulasi nilai akhir (bobot 3/8)<br>
    <code>sheet-name="Ulangan Harian 1"</code> &mdash; Sheet terpisah per ulangan harian
  </div>

 <!-- STEP 1: Login -->
  <div class="step">
    <h2><span class="step-num">1</span> Login / Registrasi</h2>
    <quiz-user-auth id="auth" apps-script-url="https://script.google.com/macros/s/AKfycbzwwv-XI1EC3puQdS8rsTjOobw8rmNXOqOkklInfFB5xBdQJ83po2lq-gxRtDuiE5LG/exec"></quiz-user-auth>
  </div>

  <explode-quiz
    id="uh1"
    sheet-name="Ulangan Harian 1"
    quiz-category="ulangan_harian"
    apps-script-url="https://script.google.com/macros/s/AKfycbzwwv-XI1EC3puQdS8rsTjOobw8rmNXOqOkklInfFB5xBdQJ83po2lq-gxRtDuiE5LG/exec"
    editable="true"
    questions='[
      {"question": "Apa kepanjangan dari HAX?", "choices": ["Hyper-Active X", "Hybrid Authoring eXperience", "High Accuracy XML", "Hyper Access X"], "correct": 1},
      {"question": "Lit Element digunakan untuk?", "choices": ["Database", "Komponen Web Custom", "Mobile App", "Operating System"], "correct": 1},
      {"question": "Google Sheets API digunakan untuk?", "choices": ["Desain Grafis", "Manipulasi Data Spreadsheet", "Video Editing", "Music Production"], "correct": 1}
    ]'>
  </explode-quiz>


   <!-- STEP 3: Kuis Formatif -->
  <div class="step">
    <h2><span class="step-num">3</span> Kuis Formatif</h2>
    <explode-quiz hide-answers hide-confetti editable="true"
      id="quiz1"
      sheet-name="Pertemuan 1"
      quiz-category="formatif"
      apps-script-url="https://script.google.com/macros/s/AKfycbzwwv-XI1EC3puQdS8rsTjOobw8rmNXOqOkklInfFB5xBdQJ83po2lq-gxRtDuiE5LG/exec"
      shuffle-choices
      questions='[
        {"type":"mc","question":"Apa kepanjangan HTML?","choices":["HyperText Markup Language","High Text Machine Language","Home Tool Markup Language","Hyperlinks Text Markup"],"correctIndex":0},
        {"type":"mc","question":"Bahasa pemrograman browser?","choices":["Python","JavaScript","Java","C++"],"correctIndex":1},
        {"type":"mc","question":"Shadow DOM berfungsi untuk?","choices":["Database","Encapsulated DOM","Server","CSS"],"correctIndex":1}
      ]'>
    </explode-quiz>
  </div>

  
  <script type="module">
    const quiz = document.querySelector('#uh1');
    const auth = document.querySelector('quiz-user-auth');

    // Sinkronkan data user ke quiz
    window.addEventListener('quiz-user-login', (e) => {
      quiz.studentId = e.detail.studentId;
      quiz.studentName = e.detail.nama;
      quiz.studentNis = e.detail.nis;
      quiz.studentAbsen = e.detail.absen;
      quiz.studentKelas = e.detail.kelas;
    });
  </script>
</body>
</html>
