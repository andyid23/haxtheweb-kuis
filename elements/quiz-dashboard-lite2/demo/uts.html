<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo: Ujian Tengah Semester (UTS)</title>
  <script type="module" src="../quiz-dashboard-lite2.js"></script>
  <script type="module" src="../lib/explode-quiz.js"></script>
  <script type="module" src="../lib/quiz-user-auth.js"></script>
  <style>
    body { padding: 24px; max-width: 800px; margin: 0 auto; font-family: system-ui; }
    h1 { color: #6750a4; }
    .info { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>📋 Ujian Tengah Semester (UTS)</h1>
  <div class="info">
    <strong>Properties yang dikirim:</strong><br>
    <code>quiz-category="uts"</code> &mdash; Masuk kalkulasi nilai akhir (bobot 2/8)<br>
    <code>sheet-name="UTS"</code> &mdash; Sheet khusus UTS<br><br>
    <strong>Catatan:</strong> Dosen bisa input/manual edit skor UTS langsung di Google Sheets atau dari Mode Dosen di dashboard.
  </div>

  <quiz-user-auth apps-script-url="https://script.google.com/macros/s/AKfycbw6iaBn4NYNwmN9z-Bks4P302cXlxiGiz4Uxr7gUyoR5y62JLEOagV3S5uhV_J7e8-V/exec"></quiz-user-auth>

  <explode-quiz
    id="uts-quiz"
    sheet-name="UTS"
    quiz-category="uts"
    apps-script-url="https://script.google.com/macros/s/AKfycbw6iaBn4NYNwmN9z-Bks4P302cXlxiGiz4Uxr7gUyoR5y62JLEOagV3S5uhV_J7e8-V/exec"
    editable="true"
    questions='[
      {"question": "Jelaskan cara kerja Lit Element lifecycle!", "choices": ["connectedCallback → render → disconnectedCallback", "render → connectedCallback", "init → run → destroy", "setup → mount → unmount"], "correct": 1},
      {"question": "Apa itu Shadow DOM?", "choices": ["Hidden HTML", "Encapsulated DOM tree", "Encrypted storage", "Server-side rendering"], "correct": 1},
      {"question": "Google Apps Script berjalan di?", "choices": ["Browser client", "Google Cloud (server-side)", "Local server", "CDN edge"], "correct": 1}
    ]'>
  </explode-quiz>

  <script type="module">
    const quiz = document.querySelector('#uts-quiz');
    window.addEventListener('quiz-user-login', (e) => {
      quiz.studentId = e.detail.studentId;
      quiz.studentName = e.detail.nama;
      quiz.studentNis = e.detail.nis;
      quiz.studentAbsen = e.detail.absen;
      quiz.studentKelas = e.detail.kelas;
    });
  </script>
</body>
</html>
