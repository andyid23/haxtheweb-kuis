<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo: Ulangan Harian 1</title>
  <script type="module" src="../quiz-dashboard-lite2.js"></script>
  <script type="module" src="../lib/explode-quiz.js"></script>
  <script type="module" src="../lib/quiz-user-auth.js"></script>
  <style>
    body { padding: 24px; max-width: 800px; margin: 0 auto; font-family: system-ui; }
    h1 { color: #6750a4; }
    .info { background: #f3f0fa; border: 1px solid #c7b3fc; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>📝 Ulangan Harian 1</h1>
  <div class="info">
    <strong>Properties yang dikirim:</strong><br>
    <code>quiz-category="ulangan_harian"</code> &mdash; Masuk kalkulasi nilai akhir (bobot 3/8)<br>
    <code>sheet-name="Ulangan Harian 1"</code> &mdash; Sheet terpisah per ulangan harian
  </div>

  <quiz-user-auth apps-script-url="https://script.google.com/macros/s/AKfycbw6iaBn4NYNwmN9z-Bks4P302cXlxiGiz4Uxr7gUyoR5y62JLEOagV3S5uhV_J7e8-V/exec"></quiz-user-auth>

  <explode-quiz
    id="uh1"
    sheet-name="Ulangan Harian 1"
    quiz-category="ulangan_harian"
    apps-script-url="https://script.google.com/macros/s/AKfycbw6iaBn4NYNwmN9z-Bks4P302cXlxiGiz4Uxr7gUyoR5y62JLEOagV3S5uhV_J7e8-V/exec"
    editable="true"
    questions='[
      {"question": "Apa kepanjangan dari HAX?", "choices": ["Hyper-Active X", "Hybrid Authoring eXperience", "High Accuracy XML", "Hyper Access X"], "correct": 1},
      {"question": "Lit Element digunakan untuk?", "choices": ["Database", "Komponen Web Custom", "Mobile App", "Operating System"], "correct": 1},
      {"question": "Google Sheets API digunakan untuk?", "choices": ["Desain Grafis", "Manipulasi Data Spreadsheet", "Video Editing", "Music Production"], "correct": 1}
    ]'>
  </explode-quiz>

  <script type="module">
    const quiz = document.querySelector('#uh1');
    const auth = document.querySelector('quiz-user-auth');

    // Sinkronkan data user ke quiz
    window.addEventListener('quiz-user-login', (e) => {
      quiz.studentId = e.detail.studentId;
      quiz.studentName = e.detail.nama;
      quiz.studentNis = e.detail.nis;
      quiz.studentAbsen = e.detail.absen;
      quiz.studentKelas = e.detail.kelas;
    });
  </script>
</body>
</html>
